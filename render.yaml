services:
  - type: web
    name: zaytoon-restaurant-public
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install --include=optional && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
